# Exactly 100 authorization and policy test cases (SPEC.md section 18.4) over the hand-authored fixture world
# (data/fixtures/world.yaml). Every case runs against the Worker policy decision point through the real Hono app
# (test/worker/authz.cases.test.ts); the 48 with layer `warehouse` also run against the DuckDB purpose views of a
# warehouse built from the same world (pipelines/tests/test_authz_warehouse.py). Subjects are case selectors resolved
# from data/fixtures/authz_subjects.json. Categories: A 12, B 15, C 30, D 16, E 8, F 13, G 6.
- id: A01
  category: A
  layers: [pdp]
  description: valid user token
  principal: privacy-01
  token: user
  action: me
  expect: {status: 200}
- id: A02
  category: A
  layers: [pdp]
  description: expired token
  principal: privacy-01
  token: expired
  action: me
  expect: {status: 401, code: expired}
- id: A03
  category: A
  layers: [pdp]
  description: nbf in the future
  principal: privacy-01
  token: nbf_future
  action: me
  expect: {status: 401, code: not_yet_valid}
- id: A04
  category: A
  layers: [pdp]
  description: wrong audience
  principal: privacy-01
  token: wrong_aud
  action: me
  expect: {status: 401, code: bad_audience}
- id: A05
  category: A
  layers: [pdp]
  description: wrong issuer
  principal: privacy-01
  token: wrong_iss
  action: me
  expect: {status: 401, code: bad_issuer}
- id: A06
  category: A
  layers: [pdp]
  description: signed by another key
  principal: privacy-01
  token: other_key
  action: me
  expect: {status: 401, code: bad_signature}
- id: A07
  category: A
  layers: [pdp]
  description: alg none
  principal: privacy-01
  token: alg_none
  action: me
  expect: {status: 401, code: bad_algorithm}
- id: A08
  category: A
  layers: [pdp]
  description: HS256 signed with the public key bytes
  principal: privacy-01
  token: hs256_confusion
  action: me
  expect: {status: 401, code: bad_algorithm}
- id: A09
  category: A
  layers: [pdp]
  description: missing token
  principal: privacy-01
  token: missing
  action: me
  expect: {status: 401, code: missing_token}
- id: A10
  category: A
  layers: [pdp]
  description: unknown kid
  principal: privacy-01
  token: unknown_kid
  action: me
  expect: {status: 401, code: unknown_kid}
- id: A11
  category: A
  layers: [pdp]
  description: service token mapped to the executor reaches an executor route
  principal: pv-executor-local
  token: service
  action: executor_claim
  expect: {status: 200}
- id: A12
  category: A
  layers: [pdp]
  description: valid token for an unknown email
  principal: privacy-01
  token: unknown_email
  action: me
  expect: {status: 403, code: unknown_principal}
