# Targets:
#   local         DuckDB file (the local stand-in for BigQuery; never described as BigQuery)
#   bigquery      production; always runs as peoplevault-executor by impersonation on top of the owner's user ADC.
#                 Running as the owner's own user is refused: the owner is in no row access policy and
#                 would silently read zero rows from protected tables.
#   bigquery_actions  (P1) the executor.yml GitHub Actions job, peoplevault-executor key from GOOGLE_APPLICATION_CREDENTIALS
#   bigquery_ci   `dbt parse` only (CI has no credentials; `dbt compile` would fail)
peoplevault:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('PV_DUCKDB_PATH', '../.data/warehouse.duckdb') }}"
      schema: main
      threads: 1
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('PV_GCP_PROJECT') }}"
      dataset: peoplevault_core
      location: US
      impersonate_service_account: "peoplevault-executor@{{ env_var('PV_GCP_PROJECT') }}.iam.gserviceaccount.com"
      threads: 4
      job_execution_timeout_seconds: 600
      job_retries: 1
      priority: interactive
      maximum_bytes_billed: 1073741824  # 1 GiB per query; shared project inside the free tier (SPEC.md 30.3.8)
    bigquery_actions:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      project: "{{ env_var('PV_GCP_PROJECT', 'ci-parse-only') }}"
      dataset: peoplevault_core
      location: US
      threads: 4
      job_execution_timeout_seconds: 600
      maximum_bytes_billed: 1073741824
    bigquery_ci:
      type: bigquery
      method: oauth
      project: ci-parse-only
      dataset: peoplevault_core
      location: US
      threads: 1
      maximum_bytes_billed: 1073741824
