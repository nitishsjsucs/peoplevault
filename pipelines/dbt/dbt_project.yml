name: peoplevault
version: "0.1.0"
config-version: 2
profile: peoplevault

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

vars:
  # Full policy tag resource names, keyed by data class. `pv dbt --target bigquery` overrides this map with
  # the names recorded by `pv setup gcp` in .secrets/prod-resources.json. These placeholders are only for
  # `dbt parse --target bigquery_ci`; target local ignores policy tags.
  pv_policy_tags:
    direct_identifier: projects/ci/locations/us/taxonomies/0/policyTags/direct_identifier
    date_of_birth: projects/ci/locations/us/taxonomies/0/policyTags/date_of_birth
    compensation: projects/ci/locations/us/taxonomies/0/policyTags/compensation
    performance: projects/ci/locations/us/taxonomies/0/policyTags/performance
    health_leave: projects/ci/locations/us/taxonomies/0/policyTags/health_leave
    protected_attribute: projects/ci/locations/us/taxonomies/0/policyTags/protected_attribute
  # Date used for coarsened columns (age band, tenure); matches RETENTION_AS_OF locally.
  pv_as_of: "2026-09-30"

on-run-end:
  - "{{ create_purpose_routines() }}"

models:
  peoplevault:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: pv_raw
      +materialized: view
      +persist_docs:
        relation: true
        columns: false
    core:
      +schema: pv_core
    marts:
      +schema: pv_marts
    purpose:
      # Views never declare policy_tags (column-level access control applies to tables; views use the tags of
      # their underlying tables), and columns: false stops dbt-bigquery from patching policyTags onto views.
      +materialized: view
      +persist_docs:
        relation: true
        columns: false
