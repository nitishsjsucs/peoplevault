version: 2

# Tables written by the loaders (`pv load`), not by dbt. peoplevault_raw holds landed exports with keys computed by the
# loader (employee_key, manager_key or reviewer_key, subject_ref); peoplevault_restricted holds the identity xref and the
# suppression list synced from D1. Both datasets are executor-only in production.
sources:
  - name: peoplevault_raw
    schema: peoplevault_raw
    tables:
      - name: hris_employees
      - name: payroll_compensation
      - name: leave_requests
      - name: performance_reviews
  - name: peoplevault_restricted
    schema: peoplevault_restricted
    tables:
      - name: identity_xref
      - name: suppression
