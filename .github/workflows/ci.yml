name: ci
on:
  push:
    branches: [main]
  pull_request: {}
env:
  WRANGLER_SEND_METRICS: "false"
  CI: "true"
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run types:check # identical with or without .dev.vars
      - run: npm run typecheck
      - run: npm test # the worker project reads only committed files (data/fixtures/*)
      - run: npm run deploy:check # dry run of the production template with placeholder ids
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - run: npm ci # some pytest cases drive the repository's own wrangler and Node scripts
      - run: uv sync --project pipelines --locked
      - run: uv run --project pipelines ruff check pipelines
      - run: uv run --project pipelines pv policy check
      - run: uv run --project pipelines pv fixtures check
      - run: uv run --directory pipelines pytest # pyproject config applies: -m "not bigquery and not e2e"
  e2e:
    needs: [worker, python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: uv sync --project pipelines --locked
      - run: npm run dev:keys
      - run: npm run eval:deletion:ci # seeds once (--fresh) itself, then runs the ci profile; exits 1 if its gate fails
      - run: uv run --project pipelines pv authz api --target local --start --allow-writes # the case file through the API, full population
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-ci
          path: evals/results/*ci*
      - if: always()
        run: npm run stop:local
